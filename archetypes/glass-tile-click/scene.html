<!doctype html>
<html data-composition-variables='[
  {"id":"before","type":"string","label":"Word before the tile","default":"With"},
  {"id":"word","type":"string","label":"Word after the tile (default BRAND.name)","default":""},
  {"id":"tile","type":"string","label":"Tile art: logo, or a BRAND.partners key (whatsapp, stripe, docusign)","default":"logo"},
  {"id":"click","type":"boolean","label":"A glass pointer clicks the tile (ripple ring once)","default":true},
  {"id":"handoff","type":"boolean","label":"Words leave and the tile grows to the frame centre at the end","default":true}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-display); }
        #__ID__-cam { position: absolute; inset: 0; }
        #__ID__-line { position: absolute; display: flex; align-items: center; white-space: nowrap; transform: translate(-50%, -50%); font-weight: 500; letter-spacing: var(--track-display); color: #fff; line-height: 1.1; }
        .__ID__-it { display: block; white-space: nowrap; }
        #__ID__-wa, #__ID__-wb { text-shadow: 0 0 18px color-mix(in srgb, var(--accent-lift) 35%, transparent); }
        #__ID__-wb { font-weight: 600; text-shadow: none; filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 35%, transparent)); overflow: visible; }
        .__ID__-l { display: inline-block; white-space: pre; opacity: 0; transform-origin: 50% 60%; }
        #__ID__-slot { position: relative; flex: none; width: 0; height: 1px; }
        #__ID__-tile { position: absolute; left: 50%; top: 50%; opacity: 0; transform-origin: 50% 50%; }
        .__ID__-body { position: absolute; inset: 0; border-radius: 26%; overflow: hidden;
          backdrop-filter: blur(22px) saturate(1.1) brightness(1.12); -webkit-backdrop-filter: blur(22px) saturate(1.1) brightness(1.12);
          background: linear-gradient(158deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.14) 48%, color-mix(in srgb, var(--glow-7) 18%, transparent) 100%);
          box-shadow: inset 0 2px 0 rgba(255,255,255,.75), inset 0 0 26px color-mix(in srgb, var(--glow-7) 30%, transparent), inset 0 -12px 26px rgba(0,0,0,.2), 0 24px 30px -8px rgba(0,0,0,.55), 0 40px 90px rgba(0,0,0,.35); }
        .__ID__-bevel { position: absolute; inset: 0; border-radius: 26%; padding: 3px; pointer-events: none;
          background: linear-gradient(135deg, rgba(255,255,255,.98) 0%, rgba(255,255,255,.55) 24%, rgba(255,255,255,.14) 56%, rgba(255,235,215,.34) 100%);
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        .__ID__-inner { position: absolute; inset: 5%; border-radius: 21%; pointer-events: none; border: 1px solid transparent;
          background: linear-gradient(145deg, rgba(255,255,255,.6), rgba(255,255,255,0) 45%, color-mix(in srgb, var(--accent-lift) 40%, transparent)) border-box;
          -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        .__ID__-refract { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
          background: radial-gradient(120% 70% at 50% 118%, color-mix(in srgb, var(--accent-lift) 32%, transparent), transparent 60%), radial-gradient(70% 45% at 22% 8%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%); }
        .__ID__-plate { position: absolute; left: 16.7%; top: 16.7%; width: 66.6%; height: 66.6%; border-radius: 25%; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px rgba(0,0,0,.18); }
        .__ID__-plate.paper { background: var(--paper); }
        .__ID__-plate img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .__ID__-plate.paper img { inset: 18%; width: 64%; height: 64%; object-fit: contain; }
        .__ID__-sheen { position: absolute; top: -30%; left: 0; width: 34%; height: 160%; opacity: 0; filter: blur(3px); transform: translateX(-200%) rotate(22deg);
          background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); }
        #__ID__-ring { position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; box-sizing: border-box; border: 2.4px solid rgba(255,255,255,.95); border-radius: 26%;
          box-shadow: 0 0 14px color-mix(in srgb, var(--glow-7) 45%, transparent), inset 0 0 12px color-mix(in srgb, var(--glow-7) 25%, transparent); }
        #__ID__-ptr, .__ID__-gh { position: absolute; left: 0; top: 0; width: 40px; height: 54px; opacity: 0; pointer-events: none; transform-origin: 4.3px 3.2px; }
        .__ID__-gh svg, #__ID__-ptr svg { position: absolute; left: 0; top: 0; display: block; overflow: visible; }
        #__ID__-ptr .pg { position: absolute; inset: 0; clip-path: path("M4.3 3.2 L4.3 42.1 L14 33.2 L20.8 48.6 L27.8 45.4 L21 30.4 L34.6 30.4 Z");
          backdrop-filter: blur(6px) brightness(1.25); -webkit-backdrop-filter: blur(6px) brightness(1.25);
          background: linear-gradient(150deg, rgba(255,255,255,.55), rgba(255,255,255,.22) 60%, rgba(255,255,255,.12)); }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
        <div id="__ID__-cam">
          <div id="__ID__-line">
            <div class="__ID__-it" id="__ID__-wa"></div>
            <div id="__ID__-slot">
              <div id="__ID__-tile">
                <div class="__ID__-body"><div class="__ID__-refract"></div><div class="__ID__-inner"></div><div class="__ID__-sheen" id="__ID__-sheen"></div></div>
                <div class="__ID__-plate" id="__ID__-plate"><img id="__ID__-art" alt="" /></div>
                <div class="__ID__-bevel"></div>
              </div>
            </div>
            <div class="__ID__-it" id="__ID__-wb"></div>
          </div>
          <div id="__ID__-ring"></div>
          <div id="__ID__-ptr">
            <div class="pg"></div>
            <svg id="__ID__-psvg" width="40" height="54" viewBox="0 0 40 54">
              <defs>
                <linearGradient id="__ID__-ps" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".98"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
                <linearGradient id="__ID__-pf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
              </defs>
              <path d="M4.3 3.2 L4.3 42.1 L14 33.2 L20.8 48.6 L27.8 45.4 L21 30.4 L34.6 30.4 Z" fill="url(#__ID__-pf)" stroke="url(#__ID__-ps)" stroke-width="2" stroke-linejoin="round"/>
              <path d="M7.4 10.6 L7.4 35.4 L13.6 29.6" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const ID = "__ID__";
          const $ = (s) => document.getElementById(ID + "-" + s);
          const root = document.querySelector('[data-composition-id="' + ID + '"]');
          const W = +root.dataset.width, H = +root.dataset.height;
          const B = window.BRAND, safe = B.format.safe;
          const v = window.__hyperframes.getVariables();
          const BEFORE = String(v.before), AFTER = String(v.word || B.name), CLICK = !!v.click, HAND = !!v.handoff;
          const cx = safe.left + (W - safe.left - safe.right) / 2, cy = safe.top + (H - safe.top - safe.bottom) / 2;
          const land = W > H * 1.4;
          const targetW = Math.min(W - safe.left - safe.right, land ? 1440 : 9999) * 0.94;
          const cam = $("cam"), line = $("line"), wa = $("wa"), wb = $("wb"), slot = $("slot"), tile = $("tile");
          Object.assign(line.style, { left: cx + "px", top: cy + "px" });
          cam.style.transformOrigin = cx + "px " + cy + "px";

          // letters (per-character spans; the brand word runs from the light accent to paper)
          const split = (el, txt, tint) => Array.from(txt).map((ch, i, a) => {
            const s = document.createElement("span"); s.className = ID + "-l"; s.textContent = ch;
            if (tint) s.style.color = "color-mix(in srgb, var(--glow-6) " + Math.round(100 - 60 * (i / Math.max(1, a.length - 1))) + "%, var(--paper))";
            el.appendChild(s); return s;
          });
          const lA = split(wa, BEFORE, false), lB = split(wb, AFTER, true);

          // tile art
          const art = $("art"), plate = $("plate");
          if (v.tile === "logo" || !B.partners[v.tile]) art.src = B.logo.tile;
          else { art.src = B.partners[v.tile]; plate.classList.add("paper"); }

          // layout: auto-fit the font so the finished line fills the safe width; measured twice (fonts may load late)
          const STACK = !land;
          const L = { F: 100, wA: 0, wB: 0, hA: 0, hB: 0, TILE: 0, SP: 0, tileCx: cx, tileCy: cy };
          const layout = () => {
            line.style.flexDirection = STACK ? "column" : "row";
            line.style.fontSize = "100px"; wa.style.width = "auto"; wb.style.width = "auto"; wa.style.height = "auto"; wb.style.height = "auto";
            const a = wa.offsetWidth, b = wb.offsetWidth, ha = wa.offsetHeight, hb = wb.offsetHeight;
            let F;
            if (STACK) F = Math.max(60, Math.min(230, 100 * targetW / Math.max(a, b, 1)));
            else F = Math.max(60, Math.min(170, 100 * targetW / (a + b + 116 + 48)));
            const k = F / 100;
            L.F = F; L.wA = a * k; L.wB = b * k; L.hA = ha * k; L.hB = hb * k;
            L.SP = (STACK ? 22 : 24) * k; L.TILE = (STACK ? 130 : 116) * k;
            line.style.fontSize = F + "px";
            Object.assign(tile.style, { width: L.TILE + "px", height: L.TILE + "px", marginLeft: -L.TILE / 2 + "px", marginTop: -L.TILE / 2 + "px" });
            if (STACK) {
              const fin = L.hA + L.TILE + 2 * L.SP + L.hB;
              L.tileCx = cx; L.tileCy = cy - fin / 2 + L.hA + (L.TILE + 2 * L.SP) / 2;
              slot.style.width = "1px";
            } else {
              const fin = L.wA + L.TILE + 2 * L.SP + L.wB;
              L.tileCx = cx - fin / 2 + L.wA + (L.TILE + 2 * L.SP) / 2; L.tileCy = cy;
            }
            const ring = $("ring"), rs = L.TILE * 2.3;
            Object.assign(ring.style, { width: rs + "px", height: rs + "px", marginLeft: -rs / 2 + "px", marginTop: -rs / 2 + "px", left: L.tileCx + "px", top: L.tileCy + "px" });
          };
          layout();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); window.__tcRefresh && window.__tcRefresh(); });

          // ---- timeline ----
          const tl = gsap.timeline({ paused: true });
          const k0 = W / 1920;
          const letters = (ls, t) => {
            tl.fromTo(ls, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.55, ease: "expo.out", stagger: 0.04 }, t);
            tl.fromTo(ls, { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.85, ease: "power2.out", stagger: 0.04 }, t);
          };
          const END = HAND ? 3.72 : (CLICK ? 3.7 : 3.0);
          // width tweens read the measured widths lazily so a late font load still lands right
          const w = { s: 0, b: 0, t: 0 };
          const apply = () => { const sz = (L.SP * w.s + (L.TILE + L.SP) * w.t) + "px"; if (STACK) { slot.style.height = sz; wb.style.height = (L.hB * w.b) + "px"; } else { slot.style.width = sz; wb.style.width = (L.wB * w.b) + "px"; } };
          window.__tcRefresh = apply;
          gsap.set(wa, { transformOrigin: "50% 50%" });
          tl.fromTo(cam, { scale: 1.2 }, { scale: 1, duration: END, ease: "power2.out" }, 0);
          tl.fromTo(cam, { x: -130 * k0, y: 80 * k0 }, { x: 0, y: 0, duration: 2.4, ease: "power2.out", immediateRender: false }, 0);
          letters(lA, 0.1);
          tl.fromTo(w, { s: 0, b: 0 }, { s: 1, b: 1, duration: 0.7, ease: "power3.out", onUpdate: apply, immediateRender: true }, 0.62);
          letters(lB, 0.62);
          // tile pop: the words slide apart
          tl.fromTo(w, { t: 0 }, { t: 1, duration: 0.62, ease: "power3.out", onUpdate: apply, immediateRender: false }, 1.85);
          tl.fromTo(tile, { opacity: 0, scale: 0, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.6)", immediateRender: false }, 1.85);
          const sheen = $("sheen");
          tl.fromTo(sheen, { xPercent: -200, opacity: 0.95 }, { xPercent: 330, opacity: 0.95, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 2.0);
          tl.set(sheen, { opacity: 0 }, 2.92);
          apply();

          const T = { x: 0, y: 0 };
          const press = { s: 1 };
          if (CLICK) {
            const ring = $("ring"), ptr = $("ptr"), psvg = $("psvg");
            tl.to(tile, { scale: 0.93, duration: 0.08, ease: "power2.out" }, 3.1);
            tl.to(tile, { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 3.18);
            tl.fromTo(ring, { opacity: 0.6, scale: 1 / 2.3 }, { opacity: 0, scale: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, 3.1);
            gsap.set(ring, { opacity: 0, scale: 1 / 2.3 });
            tl.fromTo(sheen, { xPercent: -200, opacity: 0.6 }, { xPercent: 330, opacity: 0.6, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 3.12);
            tl.set(sheen, { opacity: 0 }, 3.68);
            // pointer: a pure function of t (travel 0.65 s power3.out, rest, short slide, press)
            const pe = gsap.parseEase("power3.out"), se = gsap.parseEase("sine.inOut");
            const ps = Math.max(1, L.TILE / 96);
            let P0, CP, O, TT;
            const geo = () => {
              TT = { x: L.tileCx + 12 * ps, y: L.tileCy + 12 * ps }; O = { x: TT.x - 8 * ps, y: TT.y + 2 * ps };
              P0 = { x: W + 140, y: L.tileCy - H * 0.28 }; CP = { x: cx + (W - cx) * 0.55, y: L.tileCy - H * 0.04 };
            };
            geo();
            const pos = (t) => {
              if (t <= 2.3) return P0;
              if (t < 2.95) { const u = pe((t - 2.3) / 0.65), a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u; return { x: a * P0.x + b * CP.x + c * O.x, y: a * P0.y + b * CP.y + c * O.y }; }
              if (t < 3.1) { const u = se((t - 2.95) / 0.15); return { x: O.x + (TT.x - O.x) * u, y: O.y + (TT.y - O.y) * u }; }
              return { x: TT.x + (t - 3.1) * 7 * ps, y: TT.y + (t - 3.1) * 4 * ps };
            };
            const NG = 12, DT = 0.003, ghosts = [];
            for (let i = 0; i < NG; i++) {
              const g = document.createElement("div"); g.className = ID + "-gh";
              const sv = psvg.cloneNode(true); sv.removeAttribute("id"); g.appendChild(sv);
              cam.insertBefore(g, ptr); ghosts.push(g);
            }
            const fade = (t) => (t < 3.4 ? 1 : Math.max(0, 1 - (t - 3.4) / 0.25));
            const proxy = { t: 0 };
            const render = () => {
              const t = proxy.t, p = pos(t), f = (t >= 2.3 && t < 3.66 ? 1 : 0) * fade(t);
              gsap.set(ptr, { x: p.x, y: p.y, opacity: Math.min(1, f * Math.max(0, (t - 2.3) / 0.06)), scale: ps * press.s });
              const p1 = pos(t - 0.004), sp = Math.hypot(p.x - p1.x, p.y - p1.y) / 0.004, kk = Math.min(1, Math.max(0, (sp - 120) / 1400));
              ghosts.forEach((g, i) => { const q = pos(t - DT * (i + 1)); gsap.set(g, { x: q.x, y: q.y, scale: ps, opacity: f * kk * 0.42 * Math.pow(1 - i / NG, 1.5) }); });
            };
            const prevRefresh = window.__tcRefresh;
            window.__tcRefresh = () => { prevRefresh(); geo(); };
            tl.to(proxy, { t: 3.72, duration: 3.72, ease: "none", onUpdate: render }, 0);
            tl.to(press, { s: 0.93, duration: 0.08, ease: "power2.out", onUpdate: render }, 3.1);
            tl.to(press, { s: 1, duration: 0.36, ease: "back.out(2.5)", onUpdate: render }, 3.18);
          }
          if (HAND) {
            // words dim and blur out; the tile glides to the frame centre and grows 1.5x (the next scene starts on it)
            const hx = () => cx - L.tileCx, hy = () => cy - L.tileCy;
            tl.to([wa, wb], { opacity: 0, filter: "blur(12px)", duration: 0.24, ease: "power2.in" }, CLICK ? 3.28 : 2.8);
            tl.to(tile, { x: () => hx(), y: () => hy(), scale: 1.5, duration: 0.3, ease: "power3.out", immediateRender: false }, CLICK ? 3.4 : 2.9);
          }
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
