<!doctype html>
<html data-composition-variables='[
  {"id":"labels","type":"string","label":"Pill labels, | separated","default":"New lead|Answered|Showing booked|Application signed|Fee paid"},
  {"id":"icons","type":"string","label":"Icons, | separated (whatsapp, sms, reply, calendar, docusign, stripe, mark)","default":"whatsapp|reply|calendar|docusign|stripe"},
  {"id":"step","type":"number","label":"Seconds between pills","default":0.46,"min":0.25,"max":1.2,"step":0.01},
  {"id":"fadeOut","type":"boolean","label":"Blur out at the end (ignored when loop is on)","default":true},
  {"id":"loop","type":"boolean","label":"Loop: scroll back and end on the exact first frame, for a seamless feed loop","default":false}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-display); }
        #__ID__-drift, #__ID__-sc, #__ID__-cam { position: absolute; inset: 0; }
        .__ID__-wrap { position: absolute; top: 0; left: 0; height: 120px; }
        .__ID__-pill { position: relative; height: 120px; border-radius: 60px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
        .__ID__-dark {
          background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.05)), color-mix(in srgb, var(--accent-deep) 58%, transparent);
          backdrop-filter: blur(22px) saturate(1.5) brightness(1.15);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -10px 24px rgba(0,0,0,.18), 0 30px 80px rgba(0,0,0,.35);
          color: #fff;
        }
        .__ID__-bright {
          background: linear-gradient(180deg, var(--paper) 0%, var(--glow-7) 55%, var(--glow-6) 100%);
          box-shadow: inset 0 2px 0 rgba(255,255,255,.85), inset 0 -12px 26px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 70px color-mix(in srgb, var(--accent-lift) 45%, transparent), 0 30px 80px rgba(0,0,0,.35);
          color: var(--on-paper);
        }
        .__ID__-edge { position: absolute; inset: 0; border-radius: 60px; padding: 2.5px; pointer-events: none;
          background: linear-gradient(155deg, rgba(255,255,255,.9), rgba(255,255,255,.18) 35%, rgba(255,255,255,.12) 65%, rgba(255,255,255,.55));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        .__ID__-sheen { position: absolute; top: -20px; bottom: -20px; left: -200px; width: 160px; opacity: 0; pointer-events: none;
          background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.3) 50%, rgba(255,255,255,0)); filter: blur(10px); transform: skewX(-22deg); }
        .__ID__-ico { flex: none; width: 88px; height: 88px; margin-left: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .__ID__-dark .__ID__-ico { background: var(--paper); box-shadow: inset 0 -4px 8px rgba(0,0,0,.18), 0 4px 14px rgba(0,0,0,.3); }
        .__ID__-bright .__ID__-ico { background: var(--on-paper); box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 4px 14px rgba(0,0,0,.35); }
        .__ID__-ico img, .__ID__-ico svg { width: 48px; height: 48px; }
        .__ID__-txt { font-size: 64px; font-weight: 600; letter-spacing: var(--track-display); padding: 0 56px 0 28px; line-height: 1; position: relative; z-index: 2; }
        .__ID__-txt span { display: inline-block; white-space: pre; }
        #__ID__-dot { position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%;
          background: radial-gradient(circle at 35% 30%, var(--paper), var(--glow-6) 55%, var(--glow-5));
          box-shadow: 0 0 60px color-mix(in srgb, var(--glow-6) 70%, transparent); }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
        <div id="__ID__-drift"><div id="__ID__-sc"><div id="__ID__-cam"><div id="__ID__-dot"></div></div></div></div>
      </div>
      <script>
        (() => {
          const ID = "__ID__";
          const root = document.querySelector('[data-composition-id="' + ID + '"]');
          const W = +root.dataset.width, H = +root.dataset.height;
          const B = window.BRAND, safe = B.format.safe;
          const v = window.__hyperframes.getVariables();
          const labels = String(v.labels).split("|");
          const icons = String(v.icons).split("|");
          const STEP = +v.step;
          const paper = B.palette.paper, onPaper = B.palette.onPaper, brand = B.palette.brand;
          const glyph = (k, dark) => {
            const ink = dark ? onPaper : paper;
            if (B.partners[k]) return '<img src="' + B.partners[k] + '" alt="">';
            if (k === "mark") return '<img src="' + B.logo.tile + '" alt="">';
            if (k === "reply" || k === "sms") return '<svg viewBox="0 0 48 48"><path fill="' + ink + '" d="M8 10h32a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H22l-9 7v-7H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/>' + (k === "reply" ? '<path fill="none" stroke="' + (dark ? paper : onPaper) + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M15 23l6 6 12-12"/>' : '') + '</svg>';
            if (k === "calendar") return '<svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="33" rx="6" fill="' + brand + '"/><rect x="6" y="9" width="36" height="11" rx="6" fill="' + ink + '" opacity=".35"/><rect x="14" y="4" width="4" height="10" rx="2" fill="' + brand + '"/><rect x="30" y="4" width="4" height="10" rx="2" fill="' + brand + '"/><rect x="14" y="26" width="8" height="8" rx="2" fill="' + paper + '"/></svg>';
            return "";
          };
          const n = labels.length;
          const PITCH = H > W ? 168 : 156;
          const usableTop = safe.top, usableBot = H - safe.bottom;
          const midY = (usableTop + usableBot) / 2;
          const Y0 = Math.round(midY - ((n - 1) * PITCH) / 2 - 60);
          const CX = (safe.left + (W - safe.right)) / 2;
          const zig = H > W ? [0, -40, 30, -30, 40, -20] : [60, -90, 80, -70, 100, -50];
          const cam = document.getElementById(ID + "-cam");
          const els = labels.map((t, k) => {
            const dark = k % 2 === 0;
            const w = document.createElement("div");
            w.className = ID + "-wrap"; w.id = ID + "-w" + k;
            w.innerHTML = '<div class="' + ID + '-pill ' + ID + (dark ? '-dark' : '-bright') + '" id="' + ID + '-p' + k + '"><div class="' + ID + '-ico">' + glyph(icons[k] || "", dark) + '</div><div class="' + ID + '-txt">' + Array.from(t).map(c => "<span>" + c + "</span>").join("") + '</div><div data-layout-allow-occlusion class="' + ID + '-edge"></div><div data-layout-allow-occlusion class="' + ID + '-sheen" id="' + ID + '-sh' + k + '"></div></div>';
            cam.appendChild(w);
            const pw = w.firstChild.offsetWidth;
            w.style.left = Math.round(CX + zig[k % zig.length] - pw / 2) + "px";
            w.style.top = (Y0 + k * PITCH) + "px";
            w.style.visibility = "hidden";
            return { w, pw };
          });
          /* format scale: vertical and feed formats grow the stack ~1.3x, limited so it still fits the safe rect (and the 1.06 drift) */
          const stackH = (n - 1) * PITCH + 120, maxW = Math.max.apply(null, els.map(e => e.pw)) + 2 * Math.max.apply(null, zig.map(Math.abs));
          const target = ({ "16x9": 1, "9x16": 1.3, "4x5": 1.3, "1x1": 1.3 })[B.format.id] || 1;
          const sc = Math.max(0.6, Math.min(target, 0.93 * (usableBot - usableTop) / stackH, 0.95 * (W - safe.left - safe.right) / maxW));
          const scEl = document.getElementById(ID + "-sc");
          scEl.style.transformOrigin = CX + "px " + midY + "px"; scEl.style.transform = "scale(" + sc.toFixed(4) + ")";
          const tl = gsap.timeline({ paused: true });
          const t = k => 0.25 + k * STEP;
          const first = els[0];
          gsap.set("#" + ID + "-dot", { left: Math.round(parseFloat(first.w.style.left)), top: Y0 });
          tl.fromTo("#" + ID + "-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
          const camSt = { y: ((n - 1) * PITCH) / 2 };
          const applyCam = () => { cam.style.transform = "translateY(" + camSt.y.toFixed(2) + "px)"; };
          applyCam();
          tl.fromTo(camSt, { y: camSt.y }, { y: camSt.y, duration: 0.01, onUpdate: applyCam }, 0);
          els.forEach(({ w, pw }, k) => {
            const p = w.firstChild, chars = w.querySelectorAll("." + ID + "-txt span"), t0 = t(k);
            tl.set(w, { visibility: "visible" }, t0);
            if (k === 0) {
              tl.set("#" + ID + "-dot", { opacity: 0 }, t0);
              tl.fromTo(p, { width: 120 }, { width: pw, duration: 0.5, ease: "expo.out" }, t0);
              tl.fromTo(p.querySelector("." + ID + "-ico"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t0 + 0.05);
              tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.02, stagger: 0.035, ease: "none" }, t0 + 0.12);
            } else {
              tl.fromTo(p, { y: 100, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.65, ease: "expo.out" }, t0);
              tl.fromTo(p, { scaleX: 0.86 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, t0);
              tl.fromTo(chars, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, stagger: 0.03, ease: "power2.out" }, t0 + 0.12);
              tl.to(camSt, { y: ((n - 1) * PITCH) / 2 - (PITCH / 2) * k, duration: 0.7, ease: "power3.out", onUpdate: applyCam }, t0 - 0.04);
            }
            tl.fromTo("#" + ID + "-sh" + k, { x: 0, opacity: 0 }, { x: pw + 260, opacity: 1, duration: 0.7, ease: "power2.inOut" }, t0 + 0.12);
          });
          const end = t(n - 1) + 1.2;
          tl.fromTo("#" + ID + "-drift", { scale: 1.0, y: 0 }, { scale: 1.06, y: -20, duration: end + (v.loop ? 0 : 0.6), ease: "sine.out" }, 0);
          if (v.loop) {
            /* scroll back to the first pill, collapse it to the dot, end on the exact first frame (dot at scale 0, camera and drift reset, every pill hidden) */
            const LB = 1.1;
            tl.fromTo(camSt, { y: 0 }, { y: ((n - 1) * PITCH) / 2, duration: 0.9, ease: "power3.inOut", onUpdate: applyCam, immediateRender: false }, end);
            for (let k = n - 1; k >= 1; k--) {
              tl.to(els[k].w.firstChild, { opacity: 0, y: -60, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, end + 0.04 * (n - 1 - k));
              tl.set(els[k].w, { visibility: "hidden" }, end + 0.04 * (n - 1 - k) + 0.3);
            }
            const p0 = els[0].w.firstChild;
            tl.to(p0.querySelectorAll("." + ID + "-txt span, ." + ID + "-ico"), { opacity: 0, duration: 0.2, ease: "power2.in" }, end + 0.3);
            tl.fromTo(p0, { width: els[0].pw }, { width: 120, duration: 0.4, ease: "expo.inOut", immediateRender: false }, end + 0.4);
            tl.set(els[0].w, { visibility: "hidden" }, end + 0.82);
            tl.set("#" + ID + "-dot", { opacity: 1 }, end + 0.8);
            tl.fromTo("#" + ID + "-dot", { scale: 1 }, { scale: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, end + 0.8);
            tl.fromTo("#" + ID + "-drift", { scale: 1.06, y: -20 }, { scale: 1, y: 0, duration: LB, ease: "power2.inOut", immediateRender: false }, end);
          } else if (v.fadeOut) tl.fromTo("#" + ID + "-drift", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.6, ease: "power2.in" }, end);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
