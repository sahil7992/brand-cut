<!doctype html>
<html data-composition-variables='[
  {"id":"chips","type":"string","label":"Chips, | separated, each icon~label~state (icons: whatsapp, sms, calendar, docusign, stripe, mark, doc)","default":"sms~SMS~Answered in 9s|whatsapp~WhatsApp~Answered in 9s|calendar~Calendar~Showing booked|docusign~DocuSign~Application signed|stripe~Stripe~Fee paid"},
  {"id":"speed","type":"number","label":"Orbit speed in degrees per second","default":36,"min":12,"max":90,"step":1},
  {"id":"fadeOut","type":"boolean","label":"Blur out at the end (off = hand off the orbiting hub)","default":true}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-display); }
        #__ID__-drift, #__ID__-cam { position: absolute; inset: 0; }
        #__ID__-track { position: absolute; inset: 0; overflow: visible; }
        #__ID__-track path { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
        #__ID__-pool { position: absolute; border-radius: 50%; opacity: 0; filter: blur(30px);
          background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 38%, transparent), transparent); }
        #__ID__-hub { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform; }
        .__ID__-plate { position: absolute; inset: 0; border-radius: 30%; overflow: hidden;
          background: linear-gradient(150deg, rgba(255,255,255,.3), rgba(255,255,255,.06) 52%, rgba(255,255,255,.14)), color-mix(in srgb, var(--accent-deep) 52%, transparent);
          backdrop-filter: blur(26px) saturate(1.5) brightness(1.15); -webkit-backdrop-filter: blur(26px) saturate(1.5) brightness(1.15);
          box-shadow: inset 0 2px 0 rgba(255,255,255,.7), inset 8px 0 24px color-mix(in srgb, var(--accent-lift) 28%, transparent), inset 0 -18px 36px rgba(0,0,0,.3), 12px 40px 80px rgba(0,0,0,.55); }
        .__ID__-edge { position: absolute; inset: 0; border-radius: 30%; padding: 3px; pointer-events: none;
          background: linear-gradient(155deg, rgba(255,255,255,.95), rgba(255,255,255,.16) 35%, rgba(255,255,255,.1) 65%, rgba(255,255,255,.55));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        .__ID__-tile { position: absolute; left: 14%; top: 14%; width: 72%; height: 72%; border-radius: 22.5%; display: block; box-shadow: 0 14px 30px rgba(0,0,0,.5), 0 2px 5px rgba(0,0,0,.4); }
        .__ID__-chip { position: absolute; left: 0; top: 0; height: 96px; border-radius: 48px; display: flex; align-items: center; opacity: 0; will-change: transform, filter; color: var(--ink); overflow: hidden;
          background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.05)), color-mix(in srgb, var(--accent-deep) 58%, transparent);
          backdrop-filter: blur(22px) saturate(1.5) brightness(1.15); -webkit-backdrop-filter: blur(22px) saturate(1.5) brightness(1.15);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -10px 22px rgba(0,0,0,.18), 8px 26px 56px rgba(0,0,0,.4); }
        .__ID__-lit { position: absolute; inset: 0; opacity: 0; border-radius: 48px;
          background: linear-gradient(180deg, var(--paper) 0%, var(--glow-7) 55%, var(--glow-6) 100%);
          box-shadow: inset 0 2px 0 rgba(255,255,255,.85), inset 0 -12px 26px color-mix(in srgb, var(--accent) 35%, transparent); }
        .__ID__-edge2 { position: absolute; inset: 0; border-radius: 48px; padding: 2.5px; pointer-events: none;
          background: linear-gradient(155deg, rgba(255,255,255,.9), rgba(255,255,255,.18) 35%, rgba(255,255,255,.12) 65%, rgba(255,255,255,.55));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        .__ID__-ico { position: relative; flex: none; width: 70px; height: 70px; margin-left: 13px; border-radius: 50%; background: var(--paper); display: flex; align-items: center; justify-content: center;
          box-shadow: inset 0 -4px 8px rgba(0,0,0,.18), 0 4px 14px rgba(0,0,0,.3); }
        .__ID__-ico img, .__ID__-ico svg { width: 40px; height: 40px; }
        .__ID__-txt { position: relative; display: grid; height: 66px; padding: 0 34px 0 18px; }
        .__ID__-txt > span { grid-area: 1 / 1; white-space: nowrap; line-height: 1.1; letter-spacing: var(--track-display); }
        .__ID__-lab { font-size: 32px; font-weight: 600; align-self: start; }
        .__ID__-st { font-size: 24px; font-weight: 500; align-self: end; opacity: 0; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
        <div id="__ID__-drift"><div id="__ID__-cam">
          <div id="__ID__-pool"></div>
          <svg id="__ID__-track" viewBox="0 0 1920 1080" width="1920" height="1080"><path id="__ID__-tb" style="z-index:1"/><path id="__ID__-tf"/></svg>
          <div id="__ID__-hub"><div class="__ID__-plate"></div><div class="__ID__-edge"></div><img class="__ID__-tile" alt=""></div>
        </div></div>
      </div>
      <script>
        (() => {
          const ID = "__ID__";
          const root = document.querySelector('[data-composition-id="' + ID + '"]');
          const W = +root.dataset.width, H = +root.dataset.height;
          const B = window.BRAND, safe = B.format.safe;
          const v = window.__hyperframes.getVariables();
          const land = W > H, vert = H / W > 1.5;
          const cam = document.getElementById(ID + "-cam"), hub = document.getElementById(ID + "-hub");
          const ease = n => gsap.parseEase(n);
          const E5o = ease("expo.out"), EH = ease("back.out(1.4)"), E3o = ease("power3.out");
          const R = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a)));
          const lerp = (a, b, k) => a + (b - a) * k;
          const T_END = 5.6, T_F0 = 1.0, DEG = Math.PI / 180;
          const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
          const cW = [255, 255, 255], cD = hex(B.palette.onPaper), cSt0 = [214, 214, 214], cSt1 = cD;
          const mixc = (a, b, k) => "rgb(" + a.map((x, i) => Math.round(lerp(x, b[i], k))).join(",") + ")";
          const brand = B.palette.brand, paper = B.palette.paper;

          // layout
          const hubD = land ? 340 : vert ? 250 : 250;
          const C = land ? { x: W / 2, y: H / 2 } : { x: (safe.left + W - safe.right) / 2, y: (safe.top + H - safe.bottom) / 2 };
          const CS = land ? 1.3 : vert ? 1.08 : 1.1;
          const rx = land ? 560 : vert ? 250 : 235, ry = land ? 250 : vert ? 330 : 230, tilt = (land ? -7 : -6) * DEG;
          const proj = (th) => { const x = rx * Math.cos(th), y = ry * Math.sin(th); return { x: C.x + x * Math.cos(tilt) - y * Math.sin(tilt), y: C.y + x * Math.sin(tilt) + y * Math.cos(tilt) }; };
          hub.style.width = hub.style.height = hubD + "px";
          hub.style.left = (C.x - hubD / 2) + "px"; hub.style.top = (C.y - hubD / 2) + "px"; hub.style.zIndex = 40;
          hub.querySelector("img").src = B.logo.tile;
          const pool = document.getElementById(ID + "-pool");
          pool.style.width = (hubD * 2.1) + "px"; pool.style.height = (hubD * 0.7) + "px"; pool.style.left = (C.x - hubD * 1.05) + "px"; pool.style.top = (C.y + hubD * 0.34) + "px";
          const arc = (a0, a1) => { let d = ""; for (let k = 0; k <= 60; k++) { const p = proj(lerp(a0, a1, k / 60)); d += (k ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); } return d; };
          const tb = document.getElementById(ID + "-tb"), tf = document.getElementById(ID + "-tf");
          const svg = document.getElementById(ID + "-track"); svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("width", W); svg.setAttribute("height", H);
          svg.style.zIndex = 10;
          tb.setAttribute("d", arc(Math.PI, 2 * Math.PI)); tf.setAttribute("d", arc(0, Math.PI));
          const svgF = svg.cloneNode(false); svgF.removeAttribute("id"); svgF.style.zIndex = 45; svgF.style.position = "absolute"; svgF.style.inset = "0";
          const tf2 = document.createElementNS("http://www.w3.org/2000/svg", "path"); tf2.setAttribute("d", arc(0, Math.PI));
          tf2.style.cssText = "fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;";
          svgF.appendChild(tf2); cam.appendChild(svgF); tf.remove();

          // chips
          const glyph = k => {
            if (B.partners[k]) return '<img src="' + B.partners[k] + '" alt="">';
            if (k === "mark") return '<img src="' + B.logo.tile + '" alt="">';
            if (k === "sms") return '<svg viewBox="0 0 48 48"><path fill="' + B.palette.onPaper + '" d="M8 10h32a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H22l-9 7v-7H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/></svg>';
            if (k === "calendar") return '<svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="33" rx="6" fill="' + brand + '"/><rect x="6" y="9" width="36" height="11" rx="6" fill="' + paper + '" opacity=".35"/><rect x="14" y="4" width="4" height="10" rx="2" fill="' + brand + '"/><rect x="30" y="4" width="4" height="10" rx="2" fill="' + brand + '"/><rect x="14" y="26" width="8" height="8" rx="2" fill="' + paper + '"/></svg>';
            return '<svg viewBox="0 0 48 48"><path fill="none" stroke="' + brand + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M12 5h17l9 9v29H12zM29 5v10h9M19 26h12M19 34h8"/></svg>';
          };
          const items = String(v.chips).split("|").map(s => s.split("~").map(x => x.trim()));
          const n = items.length, SPEED = +v.speed * DEG;
          const chips = items.map(([icon, label, state], i) => {
            const el = document.createElement("div"); el.className = ID + "-chip";
            el.innerHTML = '<div class="' + ID + '-lit"></div><div class="' + ID + '-ico">' + glyph(icon) + '</div><div class="' + ID + '-txt"><span class="' + ID + '-lab">' + label + '</span><span class="' + ID + '-st">' + (state || "") + '</span></div><div class="' + ID + '-edge2"></div>';
            cam.appendChild(el);
            return { i, el, lit: el.firstChild, lab: el.querySelector("." + ID + "-lab"), st: el.querySelector("." + ID + "-st"), t0: 0.35 + i * 0.09 };
          });

          // the orbit eases to 35% speed as each chip reaches the front, so the lit chip's text is nearly still (a fast sideways sweep of high-contrast text trips the flash check) and still lands on 1.0 + i x 72 / speed
          const phase = u => u - (0.65 / n) * Math.sin(n * u);
          const state = { T: 0 };
          const render = () => {
            const T = state.T;
            hub.style.opacity = R(T, 0, 0.2);
            hub.style.transform = "scale(" + Math.max(0.0001, EH(R(T, 0, 0.6))).toFixed(4) + ")";
            pool.style.opacity = (0.9 * R(T, 0.3, 1.2)).toFixed(3);
            tb.style.opacity = (0.16 * R(T, 0.4, 1.2)).toFixed(3); tf2.style.opacity = (0.32 * R(T, 0.4, 1.2)).toFixed(3);
            chips.forEach(c => {
              const th = Math.PI / 2 - (c.i * 2 * Math.PI / n) + phase(SPEED * (T - T_F0));
              const p = proj(th), zn = (Math.sin(th) + 1) / 2;
              let d = Math.atan2(Math.sin(th - Math.PI / 2), Math.cos(th - Math.PI / 2)) / DEG; // degrees from the front
              const bump = Math.pow(Math.max(0, 1 - Math.abs(d) / 34), 1.3), bs = bump * bump * (3 - 2 * bump);
              const en = E5o(R(T, c.t0, c.t0 + 0.8));
              const x = lerp(C.x, p.x, en), y = lerp(C.y, p.y, en);
              const s = lerp(0.2, 1, en) * CS * (0.74 + 0.3 * zn) * (1 + 0.42 * bs);
              const blur = (1 - zn) * 3.6 * (1 - bs) + 8 * (1 - en);
              c.el.style.opacity = (R(T, c.t0, c.t0 + 0.2) * (0.55 + 0.45 * zn)).toFixed(3);
              c.el.style.zIndex = Math.sin(th) > 0.55 ? 50 + Math.round(zn * 9) : 20 + Math.round(zn * 9); // side chips pass behind the hub so they never cover its mark
              c.el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) translate(-50%,-50%) scale(" + Math.max(0.0001, s).toFixed(4) + ")";
              c.el.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
              c.lit.style.opacity = bs.toFixed(3);
              c.el.style.color = mixc(cW, cD, bs);
              c.lab.style.transform = "translateY(" + ((1 - bs) * 15).toFixed(2) + "px)";
              c.st.style.opacity = R(bs, 0.35, 0.9).toFixed(3); c.st.style.color = mixc(cSt0, cSt1, bs);
            });
          };
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(state, { T: 0 }, { T: T_END, duration: T_END, ease: "none", onUpdate: render }, 0);
          tl.fromTo("#" + ID + "-drift", { scale: 1.0, y: 0 }, { scale: 1.04, y: -12, duration: T_END, ease: "sine.out" }, 0);
          if (v.fadeOut) tl.fromTo("#" + ID + "-drift", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, T_END - 0.5);
          render();
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
