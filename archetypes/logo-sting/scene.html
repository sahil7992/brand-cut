<!doctype html>
<html data-composition-variables='[
  {"id":"endline","type":"string","label":"Endline under the lockup. Empty = BRAND.endline","default":""},
  {"id":"url","type":"string","label":"URL shown last. Empty = BRAND.url","default":""},
  {"id":"theme","type":"string","label":"dark or paper. paper wipes onto a paper plate over 0.5 s after the url (never a hard cut)","default":"dark"},
  {"id":"flood","type":"boolean","label":"With theme paper: true = the paper covers the full frame, false = a paper plate under half the frame","default":false}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-display); }
        .__ID__-layer { position: absolute; inset: 0; }
        #__ID__-pool { position: absolute; inset: 0; opacity: 0;
          background: radial-gradient(46% 42% at 50% 50%, color-mix(in srgb, var(--glow-3) 85%, transparent), transparent 74%); }
        .__ID__-box { position: absolute; display: flex; align-items: center; justify-content: center; }
        .__ID__-lock { position: relative; }
        .__ID__-row { display: flex; align-items: center; justify-content: center; }
        .__ID__-col { flex-direction: column; }
        .__ID__-mk { position: relative; flex: none; will-change: transform; }
        .__ID__-mk svg { display: block; width: 100%; height: 100%; overflow: visible; }
        .__ID__-mk svg rect, .__ID__-mk svg circle { transform-box: fill-box; }
        .__ID__-dark .__ID__-mk { filter: drop-shadow(0 0.07em 0.1em rgba(0,0,0,.55)) drop-shadow(0 0 0.35em color-mix(in srgb, var(--glow-5) 38%, transparent)); }
        .__ID__-pap .__ID__-mk { filter: drop-shadow(0 0.06em 0.1em rgba(60,20,20,.28)); }
        .__ID__-mk img { display: block; width: 100%; height: 100%; border-radius: 22.5%; }
        .__ID__-word { display: block; font-family: var(--logo-word-font, var(--font-display)); font-weight: var(--logo-word-weight, 700); letter-spacing: var(--logo-word-tracking, -0.035em); line-height: 1; white-space: nowrap; opacity: 0; font-style: normal; text-transform: none; }
        .__ID__-dark .__ID__-word { color: var(--logo-word-dark, var(--paper)); text-shadow: 0 0.04em 0.2em rgba(0,0,0,.5); }
        .__ID__-pap .__ID__-word { color: var(--on-paper); }
        .__ID__-end { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); text-align: center; font-weight: 500; letter-spacing: var(--track-display); line-height: 1.22; opacity: 0; }
        .__ID__-url { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; font-weight: 500; letter-spacing: var(--track-ui); opacity: 0; white-space: nowrap; }
        .__ID__-dark .__ID__-end { color: var(--ink); } .__ID__-dark .__ID__-url { color: var(--muted); }
        .__ID__-pap .__ID__-end { color: var(--on-paper); } .__ID__-pap .__ID__-url { color: color-mix(in srgb, var(--on-paper) 62%, transparent); }
        #__ID__-pap { position: absolute; inset: 0; opacity: 0; -webkit-mask-image: linear-gradient(90deg, #000 var(--m1, -30%), transparent var(--m2, -10%)); mask-image: linear-gradient(90deg, #000 var(--m1, -30%), transparent var(--m2, -10%)); }
        #__ID__-plate { position: absolute; border-radius: 36px;
          background: linear-gradient(160deg, color-mix(in srgb, var(--paper) 88%, #fff), var(--paper) 55%, color-mix(in srgb, var(--paper) 92%, #000));
          box-shadow: 0 40px 100px rgba(0,0,0,.55), 0 6px 0 rgba(255,255,255,.35) inset; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
        <div id="__ID__-pool"></div>
        <div class="__ID__-layer" id="__ID__-dark"></div>
        <div class="__ID__-layer" id="__ID__-pap" style="display:none"></div>
      </div>
      <script>
        (() => {
          const ID = "__ID__";
          const root = document.querySelector('[data-composition-id="' + ID + '"]');
          const W = +root.dataset.width, H = +root.dataset.height;
          const B = window.BRAND, safe = B.format.safe, P = B.palette, MC = B.logo.markColors;
          const v = window.__hyperframes.getVariables();
          const vert = H > W * 1.1;
          const WORD = B.logo.wordmarkText, END = String(v.endline || B.endline), URL = String(v.url || B.url);
          const paper = String(v.theme) === "paper";
          const counter = /countersign/i.test(B.logo.mark || "");
          const bx = safe.left, bw = W - safe.left - safe.right, by = safe.top, bh = H - safe.top - safe.bottom;
          const mkR = counter ? 1.8 : 1;                         // mark width / height
          const fs = Math.round(Math.min(vert ? 250 : 210, vert ? Math.min(bw / (WORD.length * 0.56), bw / (mkR * 1.15)) : bw / (WORD.length * 0.56 + mkR + 0.4)));
          const mh = Math.round(fs * (counter ? 1.0 : 1.05)), mw = Math.round(mh * mkR), gap = Math.round(fs * (counter ? 0.38 : 0.3));
          const endFs = Math.round(fs * (vert ? 0.2 : 0.24)), urlFs = Math.round(endFs * 0.72);
          const endLines = Math.max(1, Math.ceil(END.length * 0.5 * endFs / bw));
          const endH = endFs * 1.22 * endLines, mt1 = Math.round(fs * 0.4), mt2 = Math.round(endFs * 0.7);
          const below = mt1 + endH + mt2 + urlFs * 1.2;
          const upShift = Math.round(below / 2);
          function mk(host, theme) {
            const dark = theme === "dark";
            host.className += " " + ID + "-" + (dark ? "dark" : "pap");
            const box = document.createElement("div"); box.className = ID + "-box";
            Object.assign(box.style, { left: bx + "px", top: by + "px", width: bw + "px", height: bh + "px" }); host.appendChild(box);
            const lock = document.createElement("div"); lock.className = ID + "-lock"; lock.style.marginTop = (-upShift) + "px"; box.appendChild(lock);
            const row = document.createElement("div"); row.className = ID + "-row" + (vert ? " " + ID + "-col" : ""); row.style.gap = gap + "px"; row.style.fontSize = fs + "px"; lock.appendChild(row);
            const m = document.createElement("div"); m.className = ID + "-mk"; Object.assign(m.style, { width: mw + "px", height: mh + "px", fontSize: fs + "px" });
            const parts = {};
            if (counter) {
              const ink = dark ? MC.ink : (MC.onLightInk || P.onPaper), reply = dark ? MC.reply : (MC.onLightReply || MC.tile), g = ID + (dark ? "gd" : "gp");
              m.innerHTML = '<svg viewBox="3 7 18 10" fill="none" aria-label="' + WORD + '"><defs><linearGradient id="' + g + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + ink + '"/><stop offset="1" stop-color="' + ink + '" stop-opacity="1"/></linearGradient><linearGradient id="' + g + 'r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + reply + '"/><stop offset="1" stop-color="' + reply + '" stop-opacity="1"/></linearGradient></defs>' +
                '<rect class="in" x="3" y="7" width="12" height="3.6" rx="1.8" fill="url(#' + g + ')"/><circle class="dt" cx="4.8" cy="15.2" r="1.8" fill="url(#' + g + ')"/><rect class="rp" x="9" y="13.4" width="12" height="3.6" rx="1.8" fill="url(#' + g + 'r)"/></svg>';
              parts.inb = m.querySelector(".in"); parts.dot = m.querySelector(".dt"); parts.rep = m.querySelector(".rp");
            } else {
              m.innerHTML = '<div class="pp" style="width:100%;height:100%"><img src="' + B.logo.tile + '" alt="' + WORD + '"></div>'; parts.pop = m.querySelector(".pp");
            }
            row.appendChild(m);
            const word = document.createElement("div"); word.className = ID + "-word"; word.textContent = WORD; row.appendChild(word);
            const end = document.createElement("div"); end.className = ID + "-end"; end.textContent = END; Object.assign(end.style, { width: bw + "px", fontSize: endFs + "px", marginTop: mt1 + "px" }); lock.appendChild(end);
            const url = document.createElement("div"); url.className = ID + "-url"; url.textContent = URL; Object.assign(url.style, { fontSize: urlFs + "px", top: "calc(100% + " + (mt1 + endH + mt2) + "px)" }); lock.appendChild(url);
            return { m, word, end, url, parts };
          }
          const D = mk(document.getElementById(ID + "-dark"), "dark");
          let PP = null;
          if (paper) {
            const ph = document.getElementById(ID + "-pap"); ph.style.display = "block";
            const plate = document.createElement("div"); plate.id = ID + "-plate";
            if (v.flood) Object.assign(plate.style, { left: -W * 0.05 + "px", top: -H * 0.05 + "px", width: W * 1.1 + "px", height: H * 1.1 + "px", borderRadius: 0, boxShadow: "none" });
            else {
              const contentH = (vert ? mh + gap + fs : Math.max(mh, fs)) + below;
              const lockW = vert ? Math.max(mw, WORD.length * fs * 0.56) : mw + gap + WORD.length * fs * 0.56;
              const pw = Math.min(W * 0.94, Math.max(lockW, Math.min(bw, END.length * endFs * 0.5)) + 230), ph2 = Math.min(H * 0.8, contentH + 190);
              Object.assign(plate.style, { left: (bx + bw / 2 - pw / 2) + "px", top: (by + bh / 2 - ph2 / 2) + "px", width: pw + "px", height: ph2 + "px" });
            }
            ph.appendChild(plate);
            PP = mk(ph, "pap");
            gsap.set([PP.word, PP.end], { opacity: 1 }); gsap.set(PP.url, { opacity: 0.62 });
          }
          const tl = gsap.timeline({ paused: true });
          const T0 = 0.25;
          tl.fromTo("#" + ID + "-pool", { opacity: 0 }, { opacity: 0.6, duration: 1.3, ease: "sine.out" }, 0);
          // ---- the brand's own mark animation (the mark component): incoming 0.32 s, dot 0.22 s at +0.38 (softened spring, flashcheck), reply 0.38 s at +0.54
          const pt = D.parts;
          if (counter) {
            tl.fromTo(pt.inb, { x: -8, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "power4.out" }, T0);
            tl.fromTo(pt.dot, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.22, ease: "back.out(1.2)" }, T0 + 0.38);
            tl.fromTo(pt.rep, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.38, ease: "power4.out" }, T0 + 0.54);
          } else {
            tl.fromTo(pt.pop, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.4)", transformOrigin: "50% 50%" }, T0);
          }
          // ---- mark centred at 1.3x while it builds, then glides to its lockup place while the word arrives
          const TG = 1.55;
          const wordSpan = (vert ? fs : D.word.offsetWidth) + gap;       // space the word will take, measured once at build time
          const st = { g: 0 };
          const applyG = () => {
            const k = 1 - st.g, s = 1.3 - 0.3 * st.g, sh = wordSpan / 2 * k;
            D.m.style.transform = "translate(" + (vert ? 0 : sh).toFixed(2) + "px," + (vert ? sh : 0).toFixed(2) + "px) scale(" + s.toFixed(4) + ")";
          };
          applyG();
          tl.fromTo(st, { g: 0 }, { g: 1, duration: 1.0, ease: "power2.inOut", onUpdate: applyG }, TG);
          tl.fromTo(D.word, { opacity: 0, x: vert ? 0 : 36, y: vert ? 36 : 0, filter: "blur(14px)" }, { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, TG + 0.25);
          tl.fromTo(D.end, { opacity: 0, y: 14, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, TG + 0.9);
          tl.fromTo(D.url, { opacity: 0, y: 10, filter: "blur(10px)" }, { opacity: 0.85, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, TG + 1.3);
          // ---- paper wipe
          let tEnd = TG + 2.9;
          if (PP) {
            const ph = document.getElementById(ID + "-pap"), m = { v: -30 };
            const setM = () => { ph.style.setProperty("--m1", m.v.toFixed(1) + "%"); ph.style.setProperty("--m2", (m.v + 24).toFixed(1) + "%"); };
            setM();
            const tw = TG + 2.45;
            tl.to(ph, { opacity: 1, duration: 0.001 }, tw);
            tl.fromTo(m, { v: -30 }, { v: 110, duration: 0.5, ease: "power2.inOut", onUpdate: setM }, tw);
            tl.to("#" + ID + "-dark", { opacity: 0, duration: 0.001 }, tw + 0.52);
            tEnd = tw + 0.5 + 0.85;
          }
          // ---- continuous camera: slow push while the mark builds, then settle back
          tl.fromTo(["#" + ID + "-dark", "#" + ID + "-pap"], { scale: 1.0, transformOrigin: "50% 50%" }, { scale: 1.03, duration: TG + 0.2, ease: "sine.out" }, 0);
          tl.to(["#" + ID + "-dark", "#" + ID + "-pap"], { scale: 0.97, duration: tEnd - TG, ease: "sine.inOut" }, TG + 0.2);
          tl.to({}, { duration: 0.01 }, tEnd + 0.1);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
