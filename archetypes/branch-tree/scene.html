<!doctype html>
<html data-composition-variables='[
  {"id":"parent","type":"string","label":"Parent pill label. Empty = the brand name.","default":""},
  {"id":"children","type":"string","label":"Child pills, | separated, each icon~label (icons: whatsapp, sms, calendar, docusign, stripe, mark, doc)","default":"sms~SMS|whatsapp~WhatsApp|calendar~Calendar|docusign~DocuSign|stripe~Stripe"},
  {"id":"fadeOut","type":"boolean","label":"Blur out at the end (off = hand off the finished tree)","default":false}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-display); }
        #__ID__-drift { position: absolute; inset: 0; }
        #__ID__-field { position: absolute; inset: -4%; opacity: 0;
          background:
            radial-gradient(46% 40% at 82% 88%, color-mix(in srgb, var(--glow-7) 78%, transparent), transparent 70%),
            radial-gradient(40% 34% at 70% 14%, color-mix(in srgb, var(--brand-lit) 70%, transparent), transparent 72%),
            radial-gradient(38% 46% at 14% 46%, color-mix(in srgb, var(--brand-deep) 96%, #000), transparent 74%),
            linear-gradient(160deg, var(--brand-deep) 0%, var(--brand) 52%, color-mix(in srgb, var(--brand-lit) 70%, var(--glow-7)) 100%); }
        #__ID__-band { position: absolute; left: -10%; right: -10%; top: 52%; height: 22%; transform: rotate(-17deg); filter: blur(70px); opacity: .5;
          background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent-lift) 55%, transparent), transparent); }
        #__ID__-grain { position: absolute; inset: 0; opacity: .085; background: url(assets/__ID__/grain.png) 0 0 / 384px 384px; mix-blend-mode: overlay; pointer-events: none; }
        #__ID__-wires { position: absolute; inset: 0; overflow: visible; }
        #__ID__-wires path { fill: none; stroke: color-mix(in srgb, var(--ink) 70%, transparent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .__ID__-pill { position: absolute; display: flex; align-items: center; white-space: nowrap; opacity: 0; will-change: transform; border-radius: 999px; }
        .__ID__-parent { background: linear-gradient(180deg, color-mix(in srgb, var(--on-paper) 88%, #fff 12%), var(--on-paper)); color: var(--paper);
          box-shadow: inset 0 1.5px 0 rgba(255,255,255,.22), 0 3px 6px rgba(0,0,0,.3), 12px 30px 60px rgba(0,0,0,.45); }
        .__ID__-child { background: linear-gradient(180deg, #fff 0%, var(--paper) 100%); color: var(--on-paper);
          box-shadow: inset 0 2px 0 rgba(255,255,255,.95), inset 0 -8px 16px color-mix(in srgb, var(--accent) 14%, transparent), 0 3px 6px rgba(0,0,0,.22), 10px 26px 50px rgba(0,0,0,.35); }
        .__ID__-ico { flex: none; display: flex; align-items: center; justify-content: center; }
        .__ID__-parent .__ID__-ico img { border-radius: 24%; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
        .__ID__-ico img, .__ID__-ico svg { width: 100%; height: 100%; display: block; }
        .__ID__-lab { font-weight: 600; letter-spacing: var(--track-display); line-height: 1; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
        <div id="__ID__-drift">
          <div id="__ID__-field"><div id="__ID__-band"></div></div>
          <div id="__ID__-grain"></div>
          <svg id="__ID__-wires" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
        </div>
      </div>
      <script>
        (() => {
          const ID = "__ID__";
          const root = document.querySelector('[data-composition-id="' + ID + '"]');
          const W = +root.dataset.width, H = +root.dataset.height;
          const B = window.BRAND, safe = B.format.safe;
          const v = window.__hyperframes.getVariables();
          const land = W > H, vert = H / W > 1.5;
          const drift = document.getElementById(ID + "-drift"), svg = document.getElementById(ID + "-wires");
          svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("width", W); svg.setAttribute("height", H);
          const brand = B.palette.brand, paper = B.palette.paper;
          const glyph = k => {
            if (B.partners[k]) return '<img src="' + B.partners[k] + '" alt="">';
            if (k === "mark") return '<img src="' + B.logo.tile + '" alt="">';
            if (k === "sms") return '<svg viewBox="0 0 48 48"><path fill="' + B.palette.onPaper + '" d="M8 10h32a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H22l-9 7v-7H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/></svg>';
            if (k === "calendar") return '<svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="33" rx="6" fill="' + brand + '"/><rect x="6" y="9" width="36" height="11" rx="6" fill="' + paper + '" opacity=".35"/><rect x="14" y="4" width="4" height="10" rx="2" fill="' + brand + '"/><rect x="30" y="4" width="4" height="10" rx="2" fill="' + brand + '"/><rect x="14" y="26" width="8" height="8" rx="2" fill="' + paper + '"/></svg>';
            return '<svg viewBox="0 0 48 48"><path fill="none" stroke="' + brand + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M12 5h17l9 9v29H12zM29 5v10h9M19 26h12M19 34h8"/></svg>';
          };
          const kids = String(v.children).split("|").map(s => s.split("~").map(x => x.trim()));
          const n = kids.length;
          const parentLabel = String(v.parent || "").trim() || B.name;

          // metrics
          const fs = land ? 52 : vert ? 46 : H > 1200 ? 44 : 40;
          const ph = Math.round(fs * 2.5), ico = Math.round(ph * 0.58), pad = Math.round((ph - ico) / 2);
          const est = t => Math.round(Array.from(t).length * fs * 0.62 + fs * 0.3);
          const wOf = (t, hasIco) => pad + ico + Math.round(pad * 0.7) + est(t) + Math.round(pad * 1.05);
          const wP = wOf(parentLabel), wK = kids.map(k => wOf(k[1]));
          const U = H - safe.top - safe.bottom, UW = W - safe.left - safe.right;
          const dy = Math.min(Math.round(ph * 1.3), (U - ph) / n);
          const ind = Math.round(wP * 0.42), ELB = 58;
          let dx = land ? Math.round(ph * 1.35) : 150;
          const spanOf = d => Math.max(...wK.map((w, k) => ind + k * d + w)) + ELB;
          if (spanOf(dx) > UW) dx = Math.max(24, (UW - ELB - Math.max(...wK) - ind) / Math.max(1, n - 1));
          const gW = Math.max(wP, spanOf(dx));
          const L0 = Math.round(land ? (W - gW) / 2 : safe.left + (UW - gW) / 2);
          const gH = n * dy + ph;
          const T0 = Math.round(land ? (H - gH) / 2 : safe.top + Math.min(40, (U - gH) / 2));

          const mk = (cls, ico_, label, w, x, y) => {
            const el = document.createElement("div");
            el.className = ID + "-pill " + cls; el.style.cssText += "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + ph + "px;";
            el.innerHTML = '<div class="' + ID + '-ico" style="width:' + ico + 'px;height:' + ico + 'px;margin-left:' + pad + 'px;margin-right:' + Math.round(pad * 0.7) + 'px">' + glyph(ico_) + '</div><div class="' + ID + '-lab" style="font-size:' + fs + 'px">' + label + '</div>';
            drift.appendChild(el); return el;
          };
          const par = mk(ID + "-parent", "mark", parentLabel, wP, L0, T0);
          const rr = Math.round(ph * 0.28);
          const pY = T0 + ph / 2, pR = L0 + wP;
          const nodes = kids.map(([ic, lab], k) => {
            const x = L0 + ind + k * dx, y = T0 + (k + 1) * dy;
            const el = mk(ID + "-child", ic, lab, wK[k], x, y);
            const right = x + wK[k], tx = right + ELB, cy = y + ph / 2;
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", "M" + pR + " " + pY + "H" + (tx - rr) + "Q" + tx + " " + pY + " " + tx + " " + (pY + rr) + "V" + (cy - rr) + "Q" + tx + " " + cy + " " + (tx - rr) + " " + cy + "H" + right);
            p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1"; p.style.strokeDashoffset = "1"; p.style.opacity = 0;
            svg.appendChild(p);
            return { el, p };
          });

          const T_END = 4.6;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + ID + "-field", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
          tl.fromTo("#" + ID + "-band", { x: "-6%" }, { x: "6%", duration: T_END, ease: "sine.inOut" }, 0);
          tl.fromTo(par, { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          nodes.forEach(({ el, p }, k) => {
            const t = 1.0 + k * 0.12;
            tl.set(p, { opacity: 1 }, t);
            tl.fromTo(p, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, t);
            tl.fromTo(el, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)", transformOrigin: "100% 50%" }, t + 0.3);
          });
          tl.fromTo(drift, { scale: 1.0 }, { scale: 1.03, duration: T_END, ease: "sine.out", transformOrigin: "50% 50%" }, 0);
          if (v.fadeOut) tl.fromTo(drift, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, T_END - 0.5);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
