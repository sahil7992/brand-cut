<!doctype html>
<html data-composition-variables='[
  {"id":"label","type":"string","label":"Fee label (blank = BRAND.story.sampleFee.label)","default":""},
  {"id":"amount","type":"string","label":"Amount (blank = BRAND.story.sampleFee.amount)","default":""},
  {"id":"payer","type":"string","label":"Payer (blank = BRAND.story.sampleFee.payer)","default":""},
  {"id":"card","type":"string","label":"Card row text","default":"Card ending 4242"},
  {"id":"fadeOut","type":"boolean","label":"Blur out at the end","default":true}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-ui); }
        #__ID__-drift, #__ID__-cam { position: absolute; inset: 0; }
        #__ID__-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; perspective: 2000px; perspective-origin: 50% 40%; }
        #__ID__-slab { position: absolute; left: 0; top: 0; border-radius: 34px; transform-style: preserve-3d; will-change: transform; }
        #__ID__-contact { position: absolute; left: 6%; right: 6%; bottom: -30px; height: 70px; border-radius: 50%; background: rgba(0,0,0,.55); filter: blur(32px); }
        #__ID__-glass { position: absolute; inset: 0; border-radius: 34px; overflow: hidden;
          background: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.05) 40%), color-mix(in srgb, var(--accent-deep) 40%, rgba(12,12,12,.7));
          backdrop-filter: blur(24px) saturate(1.5) brightness(1.15);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -12px 28px rgba(0,0,0,.25), 0 36px 90px rgba(0,0,0,.45); }
        #__ID__-edge { position: absolute; inset: 0; border-radius: 34px; padding: 2.5px; pointer-events: none;
          background: linear-gradient(150deg, rgba(255,255,255,.9), rgba(255,255,255,.16) 32%, rgba(255,255,255,.1) 66%, rgba(255,255,255,.5));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        #__ID__-sheen { position: absolute; top: -10%; bottom: -10%; left: -160px; width: 130px; opacity: 0; pointer-events: none; transform: skewX(-18deg);
          background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.2) 50%, rgba(255,255,255,0)); filter: blur(12px); }
        .__ID__-a { position: absolute; }
        #__ID__-hdr { left: 26px; top: 22px; display: flex; align-items: center; gap: 14px; color: #fff; font: 600 24px/1 var(--font-display); letter-spacing: var(--track-display); }
        #__ID__-hdr .lg { width: 46px; height: 46px; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.3), inset 0 -3px 6px rgba(99,91,255,.12); }
        #__ID__-hdr img { width: 28px; height: 28px; }
        #__ID__-stack { left: 26px; top: 86px; width: 460px; }
        #__ID__-stack .ru-rcpt { position: absolute; left: 0; top: 0; }
        #__ID__-rB { opacity: 0; }
        #__ID__-rB .st svg { opacity: 0; }
        #__ID__-cardrow { left: 26px; width: 460px; height: 66px; border-radius: 16px; opacity: 0; display: flex; align-items: center; gap: 14px; padding: 0 18px; color: #fff; font-size: 17px;
          background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 24px rgba(0,0,0,.3); }
        #__ID__-cardrow .tm { margin-left: auto; color: rgba(255,255,255,.65); font-size: 15px; }
        #__ID__-badge { position: absolute; width: 96px; height: 96px; border-radius: 50%; opacity: 0; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(180deg, color-mix(in srgb, var(--ok) 80%, white), var(--ok));
          box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -6px 12px rgba(0,0,0,.22), 0 20px 40px rgba(0,0,0,.5), 0 0 60px color-mix(in srgb, var(--ok) 45%, transparent); }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
        <div id="__ID__-drift"><div id="__ID__-cam"><div id="__ID__-stage">
          <div id="__ID__-slab">
            <div id="__ID__-contact"></div>
            <div id="__ID__-glass"><div id="__ID__-sheen"></div></div>
            <div class="__ID__-a" id="__ID__-hdr"><span class="lg"><img alt=""></span><span>Stripe</span></div>
            <div class="__ID__-a" id="__ID__-stack"></div>
            <div class="__ID__-a" id="__ID__-cardrow"><svg width="34" height="24" viewBox="0 0 34 24" fill="none"><rect x="1" y="1" width="32" height="22" rx="4" stroke="#fff" stroke-width="2"/><path d="M1 8h32" stroke="#fff" stroke-width="3"/><path d="M6 17h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span id="__ID__-cardtxt"></span><span class="tm">Sat 11:44 AM</span></div>
            <div id="__ID__-edge"></div>
            <div id="__ID__-badge"><svg width="54" height="54" viewBox="0 0 32 32"><path id="__ID__-tick" d="M7 17 L13.5 23 L25 9" fill="none" stroke="#04271c" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div>
          </div>
        </div></div></div>
      </div>
      <script>
        (() => {
          const ID = "__ID__";
          const root = document.querySelector('[data-composition-id="' + ID + '"]');
          const W = +root.dataset.width, H = +root.dataset.height;
          const B = window.BRAND, RU = window.HF.realui, safe = B.format.safe;
          const v = window.__hyperframes.getVariables();
          const $ = (s) => document.getElementById(ID + "-" + s);
          const fee = B.story.sampleFee;
          const label = v.label || fee.label, amount = v.amount || fee.amount, payer = v.payer || fee.payer;
          const lead = B.cast.leads.find((l) => l.name === payer);
          const target = parseFloat(String(amount).replace(/[^0-9.]/g, "")) || 0;
          const money = (x) => "$" + x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          $("hdr").querySelector("img").src = B.partners.stripe;
          $("cardtxt").textContent = v.card;
          const mkR = (status, amt, id) => {
            const r = RU.receipt({ amount: amt, status, client: payer, face: lead ? lead.face : undefined });
            r.id = ID + "-" + id;
            r.querySelector(".k span").textContent = label;
            const who = r.querySelector(".who"); who.lastChild.textContent = payer + " · " + B.cast.listing.address;
            $("stack").appendChild(r); return r;
          };
          const rA = mkR("Requested", "$0.00", "rA"), rB = mkR("Paid", money(target), "rB");
          const rh = rA.offsetHeight;
          const cardrow = $("cardrow"); cardrow.style.top = 86 + rh + 16 + "px";
          const NW = 512, NH = 86 + rh + 16 + 66 + 26;
          const slab = $("slab"); slab.style.width = NW + "px"; slab.style.height = NH + "px";
          const S = HF.land ? (H - 170) / NH : 0.92 * Math.min((W - safe.left - safe.right) / NW, (H - safe.top - safe.bottom - 20) / NH);
          const cx0 = (safe.left + (W - safe.right)) / 2, cy0 = (safe.top + (H - safe.bottom)) / 2 + (HF.land ? 20 : 0);
          const stage = $("stage"); stage.style.width = NW + "px"; stage.style.height = NH + "px";
          stage.style.left = Math.round(cx0 - (NW * S) / 2) + "px"; stage.style.top = Math.round(cy0 - (NH * S) / 2) + "px"; stage.style.transform = "scale(" + S + ")";
          const badge = $("badge"); badge.style.left = NW - 96 + (HF.land ? 18 : 6) + "px"; badge.style.top = "-34px";

          // ---- timeline
          const tl = gsap.timeline({ paused: true });
          const END = 4.2, R0 = 0.95, R1 = 1.55, PAID = 2.25;
          tl.fromTo(slab, { y: 150, rotationX: 12, opacity: 0, filter: "blur(12px)" }, { y: 0, rotationX: 3, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0);
          tl.to(slab, { rotationX: 0, duration: 3.0, ease: "sine.inOut" }, 0.9);
          tl.fromTo($("sheen"), { x: 0, opacity: 0 }, { x: NW + 220, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 0.35);
          tl.set($("sheen"), { opacity: 0 }, 1.5);
          // amount rolls 0.6 s with jitter then locks
          const roll = { p: 0 }, amtEl = rA.querySelector(".amt");
          const show = () => {
            const p = roll.p, e = 1 - Math.pow(1 - p, 3);
            const j = p >= 1 ? 0 : (HF.rng(Math.floor(p * 22) + 3)() - 0.5) * target * 0.5 * (1 - p);
            amtEl.textContent = money(Math.max(0, target * e + j));
          };
          tl.fromTo(roll, { p: 0 }, { p: 1, duration: R1 - R0, ease: "none", onUpdate: show }, R0);
          tl.fromTo(rA, { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
          tl.fromTo(cardrow, { y: 24, opacity: 0, filter: "blur(6px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 1.75);
          // paid: cross to the Paid receipt, badge check strokes in
          tl.to(rB, { opacity: 1, duration: 0.18, ease: "power2.out" }, PAID);
          tl.set(rA, { opacity: 0 }, PAID + 0.19);
          tl.fromTo(badge, { opacity: 0, scale: 0.5, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, PAID + 0.02);
          tl.to($("tick"), { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, PAID + 0.2);
          tl.fromTo(rB.querySelector(".st svg"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, PAID + 0.5);
          tl.fromTo($("cam"), { scale: 1.03, transformOrigin: "50% 50%" }, { scale: 1.0, duration: END, ease: "sine.out" }, 0);
          tl.fromTo($("drift"), { y: 0 }, { y: -12, duration: END, ease: "sine.out" }, 0);
          if (v.fadeOut) tl.fromTo($("drift"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, END - 0.4);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
